<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gerar link de prévia</title>
<style>
  body { margin: 0; padding: 2rem 1.25rem 4rem; background: #F4F5F7; color: #14161B; font: 400 1rem/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.01em; }
  .intro { margin: 0 0 1.75rem; color: #4A5060; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  label { display: grid; gap: .3rem; font-weight: 600; font-size: .9rem; }
  .larga { grid-column: 1 / -1; }
  input, select, textarea { width: 100%; padding: .6rem .7rem; border: 1.5px solid #B9BFCC; border-radius: 8px; background: #FFFFFF; color: inherit; font: 400 1rem system-ui, sans-serif; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #14161B; outline-offset: 2px; }
  small { font-weight: 400; color: #4A5060; }
  textarea { min-height: 6.5rem; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: .875rem; }
  .acoes { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-top: 1rem; }
  button, .abrir { padding: .65rem 1.1rem; border: 0; border-radius: 8px; background: #14161B; color: #FFFFFF; font: 700 1rem system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  .abrir { background: transparent; color: #14161B; box-shadow: inset 0 0 0 1.5px #14161B; }
  [role="status"] { color: #1B6B3A; font-weight: 600; }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Gerar link de prévia</h1>
  <p class="intro">Preencha com os dados do perfil do lead no Google. O link muda sozinho conforme você digita.</p>
  <form id="dados">
    <label>Tipo de negócio
      <select name="t">
        <option value="clima">Ar-condicionado</option>
        <option value="pousada">Pousada</option>
        <option value="luta">Luta</option>
        <option value="musica">Música</option>
        <option value="danca">Dança</option>
      </select>
    </label>
    <label>Cidade <input name="c" autocomplete="off"></label>
    <label class="larga">Nome do negócio <input name="n" autocomplete="off"></label>
    <label>WhatsApp <small>com DDD, só números</small> <input name="w" inputmode="numeric" autocomplete="off"></label>
    <label>Nota no Google <input name="g" inputmode="decimal" placeholder="4,9" autocomplete="off"></label>
    <label>Número de avaliações <input name="a" inputmode="numeric" autocomplete="off"></label>
    <label>Modalidades <small>opcional, separadas por vírgula</small> <input name="m" placeholder="Ballet, Jazz" autocomplete="off"></label>
  </form>
  <label class="larga" style="margin-top:1.5rem">Link da prévia <textarea id="link" readonly></textarea></label>
  <div class="acoes">
    <button type="button" id="copiar">Copiar link</button>
    <a class="abrir" id="abrir" target="_blank" rel="noopener">Abrir prévia</a>
    <span role="status" id="estado"></span>
  </div>
</main>
<script>
(function () {
  'use strict';
  var form = document.getElementById('dados');
  var link = document.getElementById('link');
  var abrir = document.getElementById('abrir');
  var estado = document.getElementById('estado');

  function montar() {
    var q = new URLSearchParams();
    q.set('t', form.elements.t.value);
    ['n', 'c', 'g', 'a', 'm'].forEach(function (k) {
      var v = form.elements[k].value.trim();
      if (v) q.set(k, v);
    });
    var numero = form.elements.w.value.replace(/\D/g, '');
    if (numero) q.set('w', numero.length <= 11 ? '55' + numero : numero);
    var url = new URL('./?' + q.toString(), location.href).href;
    link.value = url;
    abrir.href = url;
    estado.textContent = '';
  }

  form.addEventListener('input', montar);
  document.getElementById('copiar').addEventListener('click', function () {
    navigator.clipboard.writeText(link.value).then(
      function () { estado.textContent = 'Link copiado.'; },
      function () { link.select(); estado.textContent = 'Selecione e copie com Ctrl+C.'; }
    );
  });
  montar();
}());
</script>
</body>
</html>
